
["Sorter Setting"]
	#name, mod, count, tags
	SortBy = "name"
	#Only valid for containers with more than 10 slots if true.
	Filter1 = true
	#Only valid for containers without invalid slot such as recipe result slot if true.
	Filter2 = true
	#Screens whose sorter buttons are hidden (toggle with the disable-buttons key). Entries are "screenId" = screen class + "@" + title translation key.
	specialList = ["item.sophisticatedbackpacks.diamond_backpack", "item.sophisticatedbackpacks.netherite_backpack", "net.minecraft.client.gui.screens.inventory.InventoryScreen@container.crafting", "com.tom.storagemod.gui.CraftingTerminalScreen@ts.crafting_terminal"]
	#是否启用默认拼音排序。
	pinyin = true
	#Per-screen button offsets: screenId (screen class + "@" + title key)|sort X|sort Y|transfer X|transfer Y.
	buttonPositions = []

